[project]
name = "scrollunwrap"
version = "0.1.0"
description = "Stream remote OME-Zarr surface predictions into the scrollfiesta mesher, flatten, and emit tifxyz."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy",
    "zarr",            # reads the OME-Zarr v2 store (works under zarr 2.x/3.x)
    "s3fs",            # anonymous s3:// access
    "fsspec",
    "numcodecs",       # blosc/zstd codec for the v2 chunks
    "trimesh",         # mesh IO, connected components, topology, hole-fill
    "scipy",           # trimesh graph/connectivity backend (body_count, split)
    "networkx",        # trimesh graph fallback / repair helpers
    "tifffile",        # read tifxyz x/y/z.tif back for renders
    "matplotlib",      # offscreen (Agg) PNG renders for vision validation
    "tqdm",
]

[project.scripts]
scrollunwrap = "scrollunwrap.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrollunwrap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: hits the real S3 OME-Zarr (deselect with -m 'not network')",
    "requires_binary: needs built cube_mesh/grid_weld/flatboi/vc_obj2tifxyz_legacy",
]
